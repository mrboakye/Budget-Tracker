<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>August Budget Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --surface-2: #fafaf9;
    --border: #e7e5e4;
    --text: #1c1917;
    --text-secondary: #78716c;
    --accent: #16a34a;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem;
  }
  .stat p { margin: 0; }
  .stat .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
  .stat .value { font-size: 18px; font-weight: 600; }
  #catList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
  .cat-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .cat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    gap: 8px;
  }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-amounts { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .cat-amounts.over { color: var(--danger); }
  .edit-input {
    border: none;
    background: transparent;
    font-family: inherit;
    color: inherit;
    padding: 2px 4px;
    border-radius: 4px;
    min-width: 0;
    flex: initial;
  }
  .edit-input:focus {
    outline: none;
    background: var(--surface-2);
  }
  .name-input { font-size: 14px; font-weight: 500; width: 100%; }
  .budget-input { font-size: 12px; color: var(--text-secondary); width: 70px; text-align: right; }
  .income-input { font-size: 18px; font-weight: 600; width: 100%; text-align: center; }
  select.income-input { text-align-last: center; cursor: pointer; }
  .bar-track { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-fill.over { background: var(--danger); }
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .section h2 { font-size: 14px; font-weight: 600; margin: 0 0 0.75rem; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  input, select {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--surface-2);
    color: var(--text);
  }
  button {
    background: var(--text);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
  }
  #expLog { display: flex; flex-direction: column; gap: 4px; font-size: 13px; max-height: 220px; overflow-y: auto; }
  .exp-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding: 6px 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .exp-label { flex: 1; }
  .exp-row.dragging { opacity: 0.6; background: var(--surface-2); border-radius: 6px; }
  .exp-row.drop-target { border-top: 2px solid var(--accent); }
  .cat-row, .exp-row { transition: transform 0.1s; }
  .exp-row { touch-action: pan-y; }
  .exp-row.armed { touch-action: none; }
  .pressing { transform: scale(0.98); background: var(--surface-2); }
  #menuOverlay, #editOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #menuOverlay.show, #editOverlay.show { display: flex; }
  .menu-card {
    background: var(--surface); border-radius: 14px; overflow: hidden;
    min-width: 200px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .menu-title { padding: 12px 16px; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
  .menu-btn {
    display: block; width: 100%; text-align: left; background: none; color: var(--text);
    border: none; border-radius: 0; padding: 14px 16px; font-size: 15px; font-weight: 500;
    border-bottom: 1px solid var(--border);
  }
  .menu-btn:last-child { border-bottom: none; }
  .menu-btn.danger { color: var(--danger); }
</style>
</head>
<body>

<h1>August Budget — Zero-Based</h1>
<div id="debug" style="font-size:11px;color:#999;margin:-0.5rem 0 0.75rem;font-family:monospace;min-height:14px;">debug: ready</div>
<button id="installBtn" style="display:none;width:100%;margin-bottom:1rem;background:var(--accent);">Install app</button>

<div class="stats">
  <div class="stat"><p class="label">Income</p><input type="number" class="edit-input income-input" id="incomeInput" /></div>
  <div class="stat"><p class="label">Budget %</p><select class="edit-input income-input" id="pctSelect"></select></div>
  <div class="stat"><p class="label">Left to budget</p><p class="value" id="leftOut">€0</p></div>
</div>
<div class="stats" style="grid-template-columns: 1fr 1fr;">
  <div class="stat"><p class="label">Total spent</p><p class="value" id="totalSpentOut">€0</p></div>
  <div class="stat"><p class="label">Left to spend</p><p class="value" id="leftToSpendOut">€2,335</p></div>
</div>

<div id="catList"></div>

<div class="section">
  <h2>Add category</h2>
  <div class="row">
    <input type="text" id="newCatName" placeholder="Category name" />
    <input type="number" id="newCatBudget" placeholder="Budget €" />
    <button id="addCatBtn">Add</button>
  </div>
</div>

<div class="section">
  <h2>Log an expense</h2>
  <div class="row">
    <select id="expCat"></select>
  </div>
  <div class="row">
    <input type="number" id="expAmount" placeholder="€ amount" />
    <input type="text" id="expNote" placeholder="Note (optional)" />
    <button id="addExpBtn">Log</button>
  </div>
  <div id="expLog"></div>
</div>

<div id="menuOverlay">
  <div class="menu-card">
    <div class="menu-title" id="menuTitle"></div>
    <button class="menu-btn" id="menuEdit">Edit</button>
    <button class="menu-btn danger" id="menuDelete">Delete</button>
    <button class="menu-btn" id="menuCancel">Cancel</button>
  </div>
</div>

<div id="editOverlay">
  <div class="menu-card" style="padding:16px;min-width:260px;">
    <div class="menu-title" style="padding:0 0 12px;border:none;">Edit expense</div>
    <select id="editExpCat" style="width:100%;margin-bottom:8px;"></select>
    <input type="number" id="editExpAmount" placeholder="€ amount" style="width:100%;margin-bottom:8px;" />
    <input type="text" id="editExpNote" placeholder="Note (optional)" style="width:100%;margin-bottom:12px;" />
    <div style="display:flex;gap:8px;">
      <button id="editExpSave" style="flex:1;background:var(--accent);">Save</button>
      <button id="editExpCancel" style="flex:1;background:var(--text-secondary);">Cancel</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'aug2026-budget-standalone';
const APP_VERSION = 'v7';

window.addEventListener('error', (e) => {
  const d = document.getElementById('debug');
  if (d) d.textContent = 'JS ERROR: ' + (e.message || e.error);
});

// Defeat stale PWA cache: nuke old caches so a fresh index.html always wins.
if ('caches' in window) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
}

let state = {
  income: 2335,
  budgetPct: 100,
  categories: [
    {id:'rent', name:'Rent/Miete', budget:416.5},
    {id:'invest', name:'Wedding fund', budget:1000},
    {id:'groceries', name:'Groceries', budget:300},
    {id:'gas', name:'Gas', budget:76},
    {id:'remittance', name:'Family remittance', budget:173},
    {id:'internet', name:'Internet', budget:34},
    {id:'electricity', name:'Electricity', budget:27},
    {id:'annualins', name:'Annual insurances save up', budget:155},
    {id:'misc', name:'Miscellaneous', budget:153.5}
  ],
  expenses: []
};

function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = Object.assign({income: 2335, budgetPct: 100}, parsed);
      (state.expenses || []).forEach((e, i) => {
        if (!e.id) e.id = 'e' + Date.now() + '_' + i;
      });
    }
  } catch(e) {}
  render();
  const d = document.getElementById('debug');
  if (d) d.textContent = 'debug: ready ' + APP_VERSION;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function spentFor(catId) {
  return state.expenses.filter(e => e.cat === catId).reduce((a,b) => a + b.amount, 0);
}
function fmt(n) {
  return '€' + n.toLocaleString('de-DE', {minimumFractionDigits: 0, maximumFractionDigits: 2});
}
function render() {
  const incomeInput = document.getElementById('incomeInput');
  if (document.activeElement !== incomeInput) incomeInput.value = state.income;

  const pctSelect = document.getElementById('pctSelect');
  if (!pctSelect.options.length) {
    for (let p = 10; p <= 100; p += 10) {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p + '%';
      pctSelect.appendChild(opt);
    }
  }
  pctSelect.value = state.budgetPct;

  const target = state.income * (state.budgetPct / 100);

  const allocated = state.categories.reduce((a,c) => a + c.budget, 0);
  const leftEl2 = document.getElementById('leftOut');
  leftEl2.textContent = fmt(target - allocated);
  leftEl2.style.color = (target - allocated) < 0 ? 'var(--danger)' : 'var(--text)';

  const totalSpent = state.expenses.reduce((a,e) => a + e.amount, 0);
  const leftToSpend = target - totalSpent;
  document.getElementById('totalSpentOut').textContent = fmt(totalSpent);
  const leftEl = document.getElementById('leftToSpendOut');
  leftEl.textContent = fmt(leftToSpend);
  leftEl.style.color = leftToSpend < 0 ? 'var(--danger)' : 'var(--text)';

  const catList = document.getElementById('catList');
  catList.innerHTML = '';
  state.categories.forEach(c => {
    const spent = spentFor(c.id);
    const remaining = c.budget - spent;
    const pct = c.budget > 0 ? Math.min(100, Math.round((spent/c.budget)*100)) : 0;
    const over = remaining < 0;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.dataset.catRow = c.id;
    row.innerHTML =
      '<div class="cat-top">' +
        '<input type="text" class="edit-input name-input" data-cat="' + c.id + '" data-field="name" value="' + c.name.replace(/"/g,'&quot;') + '" />' +
        '<span class="cat-amounts' + (over ? ' over' : '') + '" style="display:flex;align-items:center;gap:4px">' +
          fmt(spent) + ' / €<input type="number" class="edit-input budget-input" data-cat="' + c.id + '" data-field="budget" value="' + c.budget + '" />' +
          (over ? ' (over by ' + fmt(Math.abs(remaining)) + ')' : '') +
        '</span>' +
      '</div>' +
      '<div class="bar-track"><div class="bar-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>';
    catList.appendChild(row);
  });

  const sel = document.getElementById('expCat');
  const prevVal = sel.value;
  sel.innerHTML = state.categories.map(c => '<option value="'+c.id+'">'+c.name+'</option>').join('');
  if (prevVal) sel.value = prevVal;

  const log = document.getElementById('expLog');
  log.innerHTML = '';
  state.expenses.forEach(e => {
    const cat = state.categories.find(c => c.id === e.cat);
    const row = document.createElement('div');
    row.className = 'exp-row';
    row.dataset.exp = e.id;
    row.innerHTML =
      '<span class="exp-label">' + (cat ? cat.name : e.cat) + (e.note ? ' — ' + e.note : '') + '</span>' +
      '<span>' + fmt(e.amount) + '</span>';
    log.appendChild(row);
  });
}

document.getElementById('incomeInput').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  state.income = isNaN(val) ? 0 : val;
  save(); render();
});

document.getElementById('pctSelect').addEventListener('change', (e) => {
  state.budgetPct = parseInt(e.target.value, 10) || 100;
  save(); render();
});

document.getElementById('catList').addEventListener('change', (e) => {
  const catId = e.target.dataset.cat;
  const field = e.target.dataset.field;
  if (!catId || !field) return;
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  if (field === 'name') {
    cat.name = e.target.value.trim() || cat.name;
  } else if (field === 'budget') {
    const val = parseFloat(e.target.value);
    cat.budget = isNaN(val) ? 0 : val;
  }
  save(); render();
});

document.getElementById('addCatBtn').addEventListener('click', () => {
  const name = document.getElementById('newCatName').value.trim();
  const budget = parseFloat(document.getElementById('newCatBudget').value) || 0;
  if (!name) return;
  state.categories.push({id: 'c'+Date.now(), name, budget});
  document.getElementById('newCatName').value = '';
  document.getElementById('newCatBudget').value = '';
  save(); render();
});

document.getElementById('addExpBtn').addEventListener('click', () => {
  const cat = document.getElementById('expCat').value;
  const amount = parseFloat(document.getElementById('expAmount').value);
  const note = document.getElementById('expNote').value.trim();
  if (!cat || !amount) return;
  state.expenses.unshift({id: 'e'+Date.now(), cat, amount, note, date: new Date().toISOString()});
  document.getElementById('expAmount').value = '';
  document.getElementById('expNote').value = '';
  save(); render();
});

// ---- Gesture system: hold=menu, hold+move=reorder (expenses) ----
const dbg = (m) => { const d = document.getElementById('debug'); if (d) d.textContent = 'debug: ' + m; };
let menuTarget = null; // {type:'cat'|'exp', id}

let pressTimer = null;
let pressedEl = null;
let pressType = null;
let pressId = null;
let startX = 0, startY = 0;
let armed = false;
let dragging = false;
let activePointer = null;
const HOLD_MS = 350;
const MOVE_CANCEL = 12;

function findRow(target) {
  const catRow = target.closest && target.closest('[data-cat-row]');
  if (catRow) return { el: catRow, type: 'cat', id: catRow.dataset.catRow };
  const expRow = target.closest && target.closest('[data-exp]');
  if (expRow) return { el: expRow, type: 'exp', id: expRow.dataset.exp };
  return null;
}

function resetGesture() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (pressedEl) pressedEl.classList.remove('pressing', 'dragging', 'armed');
  document.querySelectorAll('.exp-row.drop-target').forEach(r => r.classList.remove('drop-target'));
  pressedEl = null; pressType = null; pressId = null;
  armed = false; dragging = false; activePointer = null;
}

function onGesturePointerDown(ev) {
  if (ev.button === 2) return;
  if (ev.target.matches('input, select, button')) return;
  const found = findRow(ev.target);
  if (!found) return;
  resetGesture();
  pressedEl = found.el;
  pressType = found.type;
  pressId = found.id;
  startX = ev.clientX;
  startY = ev.clientY;
  activePointer = ev.pointerId;
  pressedEl.classList.add('pressing');
  // Capture so subsequent moves/ups come to this element regardless of finger drift
  try { pressedEl.setPointerCapture(ev.pointerId); } catch(e) {}
  dbg('down ' + found.type + ' (' + ev.pointerType + ')');
  pressTimer = setTimeout(() => {
    armed = true;
    pressTimer = null;
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch(e){} }
    if (pressedEl) {
      pressedEl.classList.remove('pressing');
      pressedEl.classList.add('armed');
      if (pressType === 'exp') pressedEl.classList.add('dragging');
    }
    dbg('ARMED ' + pressType + ' — move to drag / release for menu');
  }, HOLD_MS);
}

function onGesturePointerMove(ev) {
  if (pressId === null) return;
  const dx = Math.abs(ev.clientX - startX);
  const dy = Math.abs(ev.clientY - startY);

  if (!armed) {
    if (dx > MOVE_CANCEL || dy > MOVE_CANCEL) { dbg('scroll — cancel'); resetGesture(); }
    return;
  }

  if (pressType === 'exp') {
    dragging = true;
    ev.preventDefault();
    document.querySelectorAll('.exp-row.drop-target').forEach(r => r.classList.remove('drop-target'));
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const overRow = over && over.closest && over.closest('[data-exp]');
    if (overRow && overRow.dataset.exp !== pressId) {
      overRow.classList.add('drop-target');
      dbg('dragging over ' + overRow.dataset.exp);
    }
  }
}

function onGesturePointerUp(ev) {
  if (pressId === null) return;

  if (armed && pressType === 'exp' && dragging) {
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const overRow = over && over.closest && over.closest('[data-exp]');
    if (overRow && overRow.dataset.exp !== pressId) {
      const fromIdx = state.expenses.findIndex(x => x.id === pressId);
      let toIdx = state.expenses.findIndex(x => x.id === overRow.dataset.exp);
      if (fromIdx > -1 && toIdx > -1) {
        const [moved] = state.expenses.splice(fromIdx, 1);
        toIdx = state.expenses.findIndex(x => x.id === overRow.dataset.exp);
        const insertAt = fromIdx < toIdx ? toIdx + 1 : toIdx;
        state.expenses.splice(insertAt, 0, moved);
        save();
        dbg('reordered');
      }
    } else {
      dbg('dropped (no move)');
    }
    resetGesture();
    render();
    return;
  }

  if (armed && !dragging) {
    const type = pressType, id = pressId;
    resetGesture();
    dbg('menu open');
    openMenu(type, id);
    return;
  }

  dbg('tap — ignored');
  resetGesture();
}

['catList', 'expLog'].forEach(id => {
  const container = document.getElementById(id);
  container.addEventListener('pointerdown', onGesturePointerDown);
  container.addEventListener('pointermove', onGesturePointerMove);
  container.addEventListener('pointerup', onGesturePointerUp);
  container.addEventListener('pointercancel', () => { dbg('pointercancel'); resetGesture(); });
  container.addEventListener('contextmenu', (e) => {
    if (findRow(e.target)) e.preventDefault();
  });
});

const overlay = document.getElementById('menuOverlay');

function openMenu(type, id) {
  menuTarget = { type, id };
  let label = '';
  if (type === 'cat') {
    const c = state.categories.find(x => x.id === id);
    label = c ? c.name : 'Category';
  } else {
    const e = state.expenses.find(x => x.id === id);
    const cat = e && state.categories.find(c => c.id === e.cat);
    label = e ? ((cat ? cat.name : e.cat) + ' · ' + fmt(e.amount)) : 'Expense';
  }
  document.getElementById('menuTitle').textContent = label;
  overlay.classList.add('show');
}

function closeMenu() {
  overlay.classList.remove('show');
  menuTarget = null;
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeMenu(); });
document.getElementById('menuCancel').addEventListener('click', closeMenu);

document.getElementById('menuDelete').addEventListener('click', () => {
  if (!menuTarget) return;
  if (menuTarget.type === 'cat') {
    state.categories = state.categories.filter(c => c.id !== menuTarget.id);
    state.expenses = state.expenses.filter(e => e.cat !== menuTarget.id);
  } else {
    state.expenses = state.expenses.filter(e => e.id !== menuTarget.id);
  }
  save(); closeMenu(); render();
});

const editOverlay = document.getElementById('editOverlay');
let editingExpId = null;

function openExpEdit(id) {
  const e = state.expenses.find(x => x.id === id);
  if (!e) return;
  editingExpId = id;
  const sel = document.getElementById('editExpCat');
  sel.innerHTML = state.categories.map(c => '<option value="'+c.id+'">'+c.name+'</option>').join('');
  sel.value = e.cat;
  document.getElementById('editExpAmount').value = e.amount;
  document.getElementById('editExpNote').value = e.note || '';
  editOverlay.classList.add('show');
}

function closeExpEdit() {
  editOverlay.classList.remove('show');
  editingExpId = null;
}

document.getElementById('editExpSave').addEventListener('click', () => {
  const e = state.expenses.find(x => x.id === editingExpId);
  if (e) {
    const amt = parseFloat(document.getElementById('editExpAmount').value);
    e.cat = document.getElementById('editExpCat').value;
    if (!isNaN(amt)) e.amount = amt;
    e.note = document.getElementById('editExpNote').value.trim();
    save();
  }
  closeExpEdit();
  render();
});

document.getElementById('editExpCancel').addEventListener('click', closeExpEdit);
editOverlay.addEventListener('click', (e) => { if (e.target === editOverlay) closeExpEdit(); });

document.getElementById('menuEdit').addEventListener('click', () => {
  if (!menuTarget) return;
  if (menuTarget.type === 'cat') {
    const id = menuTarget.id;
    closeMenu();
    render();
    const input = document.querySelector('[data-cat="' + id + '"][data-field="name"]');
    if (input) { input.focus(); input.select(); }
  } else {
    const id = menuTarget.id;
    closeMenu();
    openExpEdit(id);
  }
});

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();
    }).catch(() => {});
  });
}

let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});
</script>
</body>
</html>
